name: contract

# Weekly free check that Scenario still answers the way the plugin expects:
# every model in Plugins/Scenario/Resources/Lanes.json loads its schema and
# prices with a dry run, recommendations come back, and the reads the plugin
# depends on still answer. tools/contract_check.py sends reads and dry runs
# only and refuses paid tools itself; SCENARIO_NO_SPEND=1 is set as well, so no
# run can spend. Separate from PR CI: it reads the test credentials, which pull
# requests from forks do not get (the check then skips with a warning).
# GitHub can disable schedules after 60 days of repository inactivity.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "Plugins/Scenario/Source/ScenarioCore/**"
      - "Plugins/Scenario/Resources/Lanes.json"
      - "tools/contract_check.py"
      - ".github/workflows/contract.yml"

permissions:
  contents: read

# Serialize scheduled and manual runs so the failure issue cannot be created twice.
concurrency:
  group: contract-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    name: contract
    if: github.repository == 'scenario-labs/unreal-plugin'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Price every lane model and check the reads (0 CU)
        env:
          SCENARIO_API_KEY: ${{ secrets.SCENARIO_TEST_API_KEY }}
          SCENARIO_API_SECRET: ${{ secrets.SCENARIO_TEST_API_SECRET }}
          SCENARIO_NO_SPEND: "1"
        run: |
          if [ -z "$SCENARIO_API_KEY" ] || [ -z "$SCENARIO_API_SECRET" ]; then
            echo "::warning::SCENARIO_TEST_API_KEY and SCENARIO_TEST_API_SECRET are not set; the contract check did not run"
            exit 0
          fi
          python3 tools/contract_check.py --json "$RUNNER_TEMP/contract.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: contract-report
          path: ${{ runner.temp }}/contract.json
          if-no-files-found: ignore
          retention-days: 14

  report:
    needs: contract
    # A timed-out runner cannot report itself; a deliberate cancellation is not a failure.
    if: ${{ always() && !cancelled() && github.event_name != 'pull_request' && needs.contract.result == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scheduled contract check fails"
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          body="The free contract check (tools/contract_check.py, 0 CU) failed: a lane model no longer loads or prices, or a read the plugin depends on changed. Run: $RUN_URL"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
