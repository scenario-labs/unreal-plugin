name: links

# Checks the links in the repository's Markdown: blocking on pull requests
# that change them, and weekly against link rot, where a failure opens or
# updates one issue. GitHub can disable schedules after 60 days of inactivity.

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".lycheeignore"
      - ".github/workflows/links.yml"
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: links
    if: github.repository == 'scenario-labs/unreal-plugin'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Tracked files only, without .claude/CLAUDE.md (an import line, no
      # links) and without CHANGELOG.md, whose compare links name a tag that
      # exists only once the release is published.
      - name: Select the files to check
        run: |
          mkdir -p "$RUNNER_TEMP/links"
          git ls-files '*.md' | grep -v -E '^(\.claude/|CHANGELOG\.md$)' > "$RUNNER_TEMP/links/inputs.txt"
          cat "$RUNNER_TEMP/links/inputs.txt"
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: >-
            --verbose --no-progress --exclude-loopback --include-fragments
            --files-from ${{ runner.temp }}/links/inputs.txt
          output: ${{ runner.temp }}/links/report.md
          fail: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: links-report
          path: ${{ runner.temp }}/links/report.md
          if-no-files-found: ignore
          retention-days: 14

  report:
    needs: scan
    if: ${{ always() && !cancelled() && github.event_name != 'pull_request' && needs.scan.result == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scheduled link check fails"
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          body="A link in the Markdown docs is broken. The links-report artifact of the run lists each failing URL: $RUN_URL"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
