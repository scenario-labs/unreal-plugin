name: Bug report
description: The Studio tab, a generation, an import or the agent server behaves wrong
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        This issue is public and permanent. Before you submit, remove your API key and secret, OAuth or agent tokens, signed asset URLs, e-mail addresses, local paths with your username, and any prompt or artwork you do not want published. Team and project ids identify your account: leave them out.

        Would rather not post in public? Send the same fields to support@scenario.com. Account, billing, credit and security problems always go there or to in-app support at https://app.scenario.com.
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: One or two sentences. The symptom, not the suspected cause.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Image
        - Video
        - 3D or 3D edit
        - Material
        - Audio
        - Environment (sky)
        - Render (restyle a view)
        - Workflows or Library
        - Import, placement or provenance
        - Agents (local Scenario MCP server, Connect buttons)
        - Scripts, Blueprints or the commandlet
        - Sign in, settings or the Studio tab itself
        - Install or update
        - Documentation
        - Not sure
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps. Name the model, the settings you changed and what was selected in the level.
      placeholder: |
        1. Select a Static Mesh actor, open Create > Material, keep the default model
        2. Type "<prompt>", press Generate
        3. Look at the actor after the job finishes
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: The verbatim error text from the Studio tab or the Output Log (filter on LogScenario). Paste text, not a screenshot, so it is searchable.
    validations:
      required: true
  - type: input
    id: unreal_version
    attributes:
      label: Unreal Engine version
      description: From Help > About Unreal Editor, and say if it is a source build.
      placeholder: 5.8.0 launcher
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: plugin_version
    attributes:
      label: Plugin version
      description: From Edit > Plugins (search "Scenario"), and whether it came from Fab, a GitHub release zip or a source copy.
      placeholder: 0.2.0 GitHub release
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: "Only ids you can share publicly: the job id and model from the job card or the asset's provenance, and the UTC time. No signed asset URLs, they are credentials."
      placeholder: |
        job id: ...
        model: ...
        when: <UTC date and time>
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched open and closed issues for a duplicate.
          required: true
        - label: This report contains no keys, tokens, signed asset URLs or personal data.
          required: true
