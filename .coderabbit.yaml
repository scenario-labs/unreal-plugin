# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit configuration for unreal-plugin. It adds to the organization's central CodeRabbit
# configuration: with inheritance on, lists are combined and a value set here wins over the
# central one. Keep here only what is specific to this repository.
#
# Which copy of this file a review reads: for a pull request from a trusted author (an
# organization member, or a collaborator with write access) the one on the pull request branch;
# otherwise, forks included, the one on the pull request's base commit. A branch created before
# a change picks it up once it includes that change.
#
# To see the settings in force and where each comes from, comment
# "@coderabbitai configuration" on any pull request.

inheritance: true

reviews:
  profile: assertive
  path_instructions:
    - path: "**/*.{cpp,cc,h,hpp,cs}"
      instructions: >-
        Unreal Engine plugin. Beyond the editor plugin rules in the baseline: asynchronous callbacks
        must check the lifetime of the UObject or widget they touch; no blocking network or file
        work on the game thread; credentials stored through the engine must not be written into
        project files that are committed. Skills copied in from scenario-workspace are covered by
        the copied skills block in the baseline: one finding per issue, copies listed, no edits
        proposed to the skill text.
